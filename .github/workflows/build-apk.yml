name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Web Assets (www)
        run: |
          mkdir -p www/audio
          cp -f index.html styles.css app.js prayer-times.js namaz-data.js manifest.json sw.js icon.png www/ 2>/dev/null || true
          cp -f audio/*.mp3 www/audio/ 2>/dev/null || true
          node -e '
            const fs = require("fs");
            const cfg = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            cfg.webDir = "www";
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

      - name: Install dependencies & Create Android Project
        run: |
          npm install
          npx cap add android
          mkdir -p android/app/src/main/res/raw android/app/src/main/res/drawable
          cp -f audio/*.mp3 android/app/src/main/res/raw/ 2>/dev/null || true
          if [ -f icon.png ]; then
            cp -f icon.png android/app/src/main/res/drawable/ic_stat_muslim_day.png
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp -f icon.png "$dir/ic_launcher.png"
                cp -f icon.png "$dir/ic_launcher_round.png"
                cp -f icon.png "$dir/ic_launcher_foreground.png"
              fi
            done
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuslimDay-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
