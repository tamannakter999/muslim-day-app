name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies & Create Android Project
        run: |
          npm install
          npx cap add android
          mkdir -p android/app/src/main/res/raw
          cp audio/durood_reminder.mp3 android/app/src/main/res/raw/
          cp audio/istighfar_reminder.mp3 android/app/src/main/res/raw/
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuslimDay-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
